# Merge^{da+is} (135M): two-model TIES merge of Danish + Icelandic only.
# Matches jekunz/smollm135m-da1-is1-ties.
merge_method: ties
models:
  - model: jekunz/smollm-135m-cpt-fineweb-danish
    parameters:
      weight: 1.0
      density: 0.5
  - model: jekunz/smollm-135m-cpt-fineweb-icelandic
    parameters:
      weight: 1.0
      density: 0.5

base_model: HuggingFaceTB/SmolLM2-135M-Instruct
dtype: bfloat16
