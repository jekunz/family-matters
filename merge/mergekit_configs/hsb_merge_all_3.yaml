# TIES merge of Czech + German + Polish full models for HSB (Upper Sorbian)
# Merges all available source languages with equal weights

merge_method: ties
models:
  - model: ${MODELS_DIR}/smollm-360m-full-cs
    parameters:
      weight: 1.0
      density: 0.5
  - model: ${MODELS_DIR}/smollm-360m-full-de
    parameters:
      weight: 1.0
      density: 0.5
  - model: ${MODELS_DIR}/smollm-360m-full-pl
    parameters:
      weight: 1.0
      density: 0.5

base_model: HuggingFaceTB/SmolLM2-360M-Instruct
dtype: bfloat16
