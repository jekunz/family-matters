# TIES merge of Finnish + Swedish full models for SE (Northern Sami)
# Merges the two most linguistically relevant source languages

merge_method: ties
models:
  - model: ${MODELS_DIR}/smollm-360m-full-fi
    parameters:
      weight: 1.0
      density: 0.5
  - model: ${MODELS_DIR}/smollm-360m-full-sv
    parameters:
      weight: 1.0
      density: 0.5

base_model: HuggingFaceTB/SmolLM2-360M-Instruct
dtype: bfloat16
