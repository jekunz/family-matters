# Merge^eq (360M): equal-weight TIES merge of all 5 Scandinavian transfer languages.
# Matches jekunz/smollm360m-da1-is1-nno1-nob1-sv1-ties.
merge_method: ties
models:
  - model: jekunz/smollm-360m-cpt-fineweb-danish
    parameters:
      weight: 1.0
      density: 0.5
  - model: jekunz/smollm-360m-cpt-fineweb-icelandic
    parameters:
      weight: 1.0
      density: 0.5
  - model: jekunz/smollm-360m-cpt-fineweb-norwegian-nynorsk
    parameters:
      weight: 1.0
      density: 0.5
  - model: jekunz/smollm-360m-cpt-fineweb-norwegian-bokmaal
    parameters:
      weight: 1.0
      density: 0.5
  - model: jekunz/smollm-360m-cpt-fineweb-swedish
    parameters:
      weight: 1.0
      density: 0.5

base_model: HuggingFaceTB/SmolLM2-360M-Instruct
dtype: bfloat16
